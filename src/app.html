<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			NO PAGE ZOOM. The application is one non-scrolling surface, and a pinch means "zoom the map"
			over the game view — so a page zoom can only ever push part of the surface out of reach, and
			the very gesture that would undo it is the one the map claims. The replacement is in the
			application: a size for the shell in the settings (`--ui-scale`), and a larger step by default
			wherever the pointer is a finger.

			Two things this line does NOT settle. iOS Safari ignores `user-scalable`/`maximum-scale`; there
			only `shell/page-zoom.ts` bites. And whatever else shrinks the visible area — the on-screen
			keyboard above all — is caught by `shell/visual-viewport.svelte.ts`.

			`interactive-widget=resizes-content` is the cheap half of the keyboard case: Chromium then
			shrinks the LAYOUT viewport when the keyboard opens, so `100dvh` shrinks with it and the
			control bar stays in view without a line of script.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />

		<!--
			SEARCH-ENGINE METADATA LIVES HERE, NOT IN `<svelte:head>`.

			The application runs with `ssr = false`: the prerendered `index.html` contains no rendered
			component markup, so anything a component puts in the head only exists once the page has
			executed JavaScript. A crawler that does not run scripts would see an empty document. This
			file is the only head that is always in the delivered HTML.

			The texts stay ENGLISH even though the interface follows the browser: the shell language is
			decided at runtime (`shell/i18n.ts`), and a crawler never gets there.
		-->
		<title>webserf — The Settlers (1993) in the browser</title>
		<meta
			name="description"
			content="“The Settlers” of 1993, in your browser: the rules ported from the original DOS program, the graphics read from your own copy of the game. Nothing is uploaded — your archive and your saved games stay with you."
		/>
		<meta name="author" content="webserf" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0a0b0a" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="webserf" />
		<meta property="og:title" content="webserf — The Settlers (1993) in the browser" />
		<meta
			property="og:description"
			content="A browser reimplementation of the 1993 DOS game “The Settlers”. Bring your own copy of the game files — nothing is uploaded."
		/>
		<meta property="og:image" content="./icon-512.png" />
		<meta name="twitter:card" content="summary" />

		<!--
			INSTALLABILITY. The manifest link belongs here for the same reason as the metadata above: with
			`ssr = false` a `<svelte:head>` entry only exists once the page has run its JavaScript, while
			the browser weighs the install criteria against the document it loaded.

			Being installed is not cosmetic here — an installed application is the only place where the
			browser keeps a granted folder handle across restarts, which is what the saved games use.
		-->
		<link rel="manifest" href="./manifest.webmanifest" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
